# Namespace ve kalici disk alanlari
#
# Gizli bilgiler bu dosyada TUTULMAZ. Secret'i kurulumda tek seferlik olarak
# uretip uygulayin (bkz. README "Gizli degerleri uretin"):
#
#   kubectl -n burs create secret generic burs-gizli \
#     --from-literal=DATABASE_DSN="burs:<db-sifresi>@tcp(burs-mariadb:3306)/burs" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=BOOTSTRAP_ADMIN_USER="admin" \
#     --from-literal=BOOTSTRAP_ADMIN_PASS="<ilk-sifre>" \
#     --from-literal=MARIADB_ROOT_PASSWORD="<root-sifresi>" \
#     --from-literal=MARIADB_PASSWORD="<db-sifresi>"
---
apiVersion: v1
kind: Namespace
metadata:
  name: burs
---
# Yüklenen belgelerin ve şifreleme anahtarının tutulduğu disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-veri
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName belirtilmedi: kümenin varsayılanı kullanılır (k3s'te local-path)
---
# Veritabanı diski
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-mariadb-veri
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# Yedeklerin tutulduğu disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-yedek
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
