# Namespace, gizli bilgiler ve kalici disk alanlari
---
apiVersion: v1
kind: Namespace
metadata:
  name: burs
---
# ÖNEMLİ: Bu dosyadaki değerler örnektir. Uygulamadan önce değiştirin:
#   SECRET_KEY üretmek için:  openssl rand -hex 32
#   Şifreler için:            openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: burs-gizli
  namespace: burs
type: Opaque
stringData:
  # Uygulamanın veritabanı bağlantısı (kullanıcı:şifre@tcp(sunucu:3306)/veritabani)
  DATABASE_DSN: "burs:DEGISTIRIN_DB_SIFRESI@tcp(burs-mariadb:3306)/burs"
  # T.C. kimlik numarası şifrelemesi ve çerez imzalama anahtarı (64 haneli hex)
  SECRET_KEY: "DEGISTIRIN_64_HANELI_HEX_ANAHTAR"
  # İlk yönetici hesabı (ilk açılışta oluşturulur, sonra panelden değiştirin)
  BOOTSTRAP_ADMIN_USER: "admin"
  BOOTSTRAP_ADMIN_PASS: "DEGISTIRIN_ILK_SIFRE"
  # MariaDB kök ve uygulama şifreleri
  MARIADB_ROOT_PASSWORD: "DEGISTIRIN_ROOT_SIFRESI"
  MARIADB_PASSWORD: "DEGISTIRIN_DB_SIFRESI"
---
# Yüklenen belgelerin ve şifreleme anahtarının tutulduğu disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-veri
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# Veritabanı diski
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-mariadb-veri
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# Yedeklerin tutulduğu disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: burs-yedek
  namespace: burs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
